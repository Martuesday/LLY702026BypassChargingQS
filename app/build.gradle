plugins { id 'com.android.application' }
android {
    namespace 'com.martheus.bypasschargingqs'
    compileSdk 36
    defaultConfig {
        applicationId "com.martheus.bypasschargingqs"
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
